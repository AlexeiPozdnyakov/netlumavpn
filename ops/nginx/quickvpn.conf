limit_req_zone $binary_remote_addr zone=quickvpn_mobile_api:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name netlumavpn.example www.netlumavpn.example admin.netlumavpn.example api.netlumavpn.example vpn.netlumavpn.example trojan.netlumavpn.example;

    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location /api/v1/mobile/ {
        return 404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name api.netlumavpn.example admin.netlumavpn.example;

    ssl_certificate /etc/letsencrypt/live/api.netlumavpn.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.netlumavpn.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 2m;
    limit_req_status 429;

    location /api/v1/mobile/ {
        limit_req zone=quickvpn_mobile_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

name: QuickVPN
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6659MLRZ5F
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
packages:
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit
    from: 1.1.0
targets:
  QuickVPN:
    type: application
    platform: iOS
    sources:
      - path: QuickVPN
      - path: QuickVPNShared
    dependencies:
      - package: SwiftyXrayKit
        product: SwiftyXrayKit
      - target: QuickVPNTunnelExtension
        embed: true
      - target: QuickVPNWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.QuickVPN
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: QuickVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickVPN/QuickVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
  QuickVPNWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: QuickVPNWidget
      - path: QuickVPNShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.QuickVPN.Widget
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: QuickVPNWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickVPNWidget/QuickVPNWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  QuickVPNTunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: QuickVPNTunnelExtension
      - path: QuickVPNShared
    dependencies:
      - package: SwiftyXrayKit
        product: SwiftyXrayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.QuickVPN.PacketTunnel
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: QuickVPNTunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickVPNTunnelExtension/QuickVPNTunnelExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  QuickVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuickVPNTests
    dependencies:
      - target: QuickVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.QuickVPNTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuickVPN.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/QuickVPN"
        GENERATE_INFOPLIST_FILE: YES
  QuickVPNUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuickVPNUITests
    dependencies:
      - target: QuickVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.QuickVPNUITests
        TEST_TARGET_NAME: QuickVPN
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QuickVPN:
    build:
      targets:
        QuickVPN: all
        QuickVPNTunnelExtension: all
        QuickVPNWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuickVPNTests
        - QuickVPNUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

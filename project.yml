name: NetlumaVPN
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6659MLRZ5F
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    CLANG_ENABLE_MODULES: YES
configFiles:
  Debug: Config/AppStoreExportCompliance.xcconfig
  Release: Config/AppStoreExportCompliance.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.15.0
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit
    from: 1.1.0
  # Native WireGuard, vendored locally (patched manifest 5.3->5.5 + sys/types.h in WireGuardKitC.h).
  # Linked ONLY into NetlumaVPNWireGuardExtension — never the Xray extension or the app (two Go
  # runtimes in one process crash the extension; see docs/KNOWN_ISSUES.md #14). Needs Go to build.
  WireGuardKit:
    path: Vendor/wireguard-apple
targets:
  NetlumaVPN:
    type: application
    platform: iOS
    sources:
      - path: NetlumaVPN
        excludes:
          - Subscriptions.storekit
      - path: NetlumaVPNShared
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: SwiftyXrayKit
        product: SwiftyXrayKit
      - target: NetlumaVPNTunnelExtension
        embed: true
      - target: NetlumaVPNWireGuardExtension
        embed: true
      - target: NetlumaVPNWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.NetlumaVPN
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: NetlumaVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetlumaVPN/NetlumaVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    postBuildScripts:
      - name: Validate App Store export compliance code
        basedOnDependencyAnalysis: false
        script: |
          if [ "${ACTION:-}" = "install" ] && [ "${SKIP_INSTALL:-}" = "NO" ]; then
            if [ -z "${APP_STORE_EXPORT_COMPLIANCE_CODE:-}" ] || [ "${APP_STORE_EXPORT_COMPLIANCE_CODE:-}" = "REPLACE_WITH_CODE_FROM_APP_STORE_CONNECT" ]; then
              echo "error: APP_STORE_EXPORT_COMPLIANCE_CODE must match the export compliance code shown in App Store Connect before archiving for upload. Create Config/AppStoreExportCompliance.local.xcconfig from the .example file, or pass APP_STORE_EXPORT_COMPLIANCE_CODE=<code> to xcodebuild archive."
              exit 1
            fi
          fi
      - name: Generate vendor framework dSYMs for archive
        basedOnDependencyAnalysis: false
        script: |
          if [ "${ACTION:-}" != "install" ] || [ "${SKIP_INSTALL:-}" = "YES" ]; then
            exit 0
          fi

          FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          if [ ! -d "$FRAMEWORKS_DIR" ]; then
            exit 0
          fi

          mkdir -p "${DWARF_DSYM_FOLDER_PATH}"
          find "$FRAMEWORKS_DIR" -maxdepth 1 -type d -name "*.framework" | while IFS= read -r framework; do
            framework_name="$(basename "$framework" .framework)"
            binary="$framework/$framework_name"
            destination="${DWARF_DSYM_FOLDER_PATH}/${framework_name}.framework.dSYM"

            if [ ! -f "$binary" ] || [ -d "$destination" ]; then
              continue
            fi

            echo "Generating dSYM for ${framework_name}.framework"
            if ! dsymutil "$binary" -o "$destination"; then
              echo "warning: Failed to generate dSYM for ${framework_name}.framework"
              rm -rf "$destination"
            fi
          done
      - name: Upload Firebase Crashlytics dSYMs
        basedOnDependencyAnalysis: false
        script: |
          FIREBASE_CRASHLYTICS_RUN_SCRIPT="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "$FIREBASE_CRASHLYTICS_RUN_SCRIPT" ]; then
            "$FIREBASE_CRASHLYTICS_RUN_SCRIPT"
          else
            echo "warning: Firebase Crashlytics run script not found; resolve Swift packages before archiving."
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}.debug.dylib
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
  NetlumaVPNWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NetlumaVPNWidget
      - path: NetlumaVPNShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.NetlumaVPN.Widget
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: NetlumaVPNWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetlumaVPNWidget/NetlumaVPNWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  NetlumaVPNTunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NetlumaVPNTunnelExtension
      - path: NetlumaVPNShared
    dependencies:
      - package: SwiftyXrayKit
        product: SwiftyXrayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.NetlumaVPN.PacketTunnel
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: NetlumaVPNTunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetlumaVPNTunnelExtension/NetlumaVPNTunnelExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  # External-build target: compiles wireguard-go-bridge (libwg-go.a) from the vendored package via
  # its Makefile (which the WireGuardKit SPM target links with -lwg-go). Requires Go on PATH — the
  # wrapper script adds Homebrew's bin. Only NetlumaVPNWireGuardExtension depends on it.
  WireGuardGoBridgeiOS:
    type: ""
    platform: iOS
    legacy:
      toolPath: $(SRCROOT)/ops/build-wireguard-go.sh
      passSettings: true
      workingDirectory: $(SRCROOT)/Vendor/wireguard-apple/Sources/WireGuardKitGo
  # Dedicated WireGuard packet-tunnel extension: links WireGuardKit/wireguard-go ONLY (NOT
  # SwiftyXrayKit), so its process has a single Go runtime. Proxy protocols stay in
  # NetlumaVPNTunnelExtension. Shares the App Group + Keychain group so it can read the profile.
  NetlumaVPNWireGuardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NetlumaVPNWireGuardExtension
      - path: NetlumaVPNShared
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
      - target: WireGuardGoBridgeiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.NetlumaVPN.WireGuard
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: NetlumaVPNWireGuardExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetlumaVPNWireGuardExtension/NetlumaVPNWireGuardExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  NetlumaVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NetlumaVPNTests
    dependencies:
      - target: NetlumaVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.NetlumaVPNTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NetlumaVPN.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NetlumaVPN"
        GENERATE_INFOPLIST_FILE: YES
  NetlumaVPNUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NetlumaVPNUITests
    dependencies:
      - target: NetlumaVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseipozdiakov.NetlumaVPNUITests
        TEST_TARGET_NAME: NetlumaVPN
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NetlumaVPN:
    build:
      targets:
        NetlumaVPN: all
        NetlumaVPNTunnelExtension: all
        NetlumaVPNWireGuardExtension: all
        NetlumaVPNWidget: all
    run:
      config: Debug
      storeKitConfiguration: NetlumaVPN/Subscriptions.storekit
    test:
      config: Debug
      targets:
        - NetlumaVPNTests
        - NetlumaVPNUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
